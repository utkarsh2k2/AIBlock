<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI or Not</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#070709;--card:#111114;--card2:#18181c;--border:rgba(255,255,255,.06);
    --glass:rgba(255,255,255,.03);
    --text:#eeeee8;--text2:#7a7a74;--text3:#3e3e3a;
    --fake:#ff4444;--fake-dim:rgba(255,68,68,.06);--fake-glow:rgba(255,68,68,.12);
    --real:#3cff9e;--real-dim:rgba(60,255,158,.06);--real-glow:rgba(60,255,158,.12);
    --gold:#ffd700;
  }
  html,body{height:100%;overflow:hidden}
  body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center}

  .phone{width:375px;height:812px;max-height:100vh;max-width:100vw;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}

  /* Top */
  .top-bar{padding:54px 24px 0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
  .logo{font-family:'Instrument Serif',serif;font-size:22px;font-style:italic;letter-spacing:-.3px;opacity:.9}
  .streak-badge{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--gold);opacity:0;transition:opacity .3s}
  .streak-badge.visible{opacity:1}

  /* Genre */
  .genre-bar{padding:16px 24px 0;display:flex;gap:6px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
  .genre-bar::-webkit-scrollbar{display:none}
  .genre-pill{padding:5px 14px;border-radius:18px;font-size:11px;font-weight:600;letter-spacing:.3px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0}
  .genre-pill.active{background:var(--text);color:var(--bg);border-color:var(--text)}

  /* Card area */
  .card-area{flex:1;position:relative;padding:16px 20px;display:flex;align-items:center;justify-content:center}

  /* Music card */
  .music-card{
    width:100%;max-width:335px;height:auto;max-height:420px;
    background:linear-gradient(168deg,var(--card) 0%,#0d0d10 100%);
    border:1px solid var(--border);
    border-radius:22px;position:absolute;
    display:flex;flex-direction:column;overflow:hidden;
    cursor:grab;touch-action:none;user-select:none;
    box-shadow:0 8px 40px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.02) inset;
    transition:box-shadow .2s;
  }
  .music-card:active{cursor:grabbing}
  .music-card.gone{transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .4s;pointer-events:none}
  .music-card:last-child{z-index:3}
  .music-card:nth-last-child(2){z-index:2;transform:scale(.96) translateY(10px);opacity:.5;pointer-events:none}
  .music-card:nth-last-child(3){z-index:1;transform:scale(.92) translateY(20px);opacity:.25;pointer-events:none}

  /* Vinyl art */
  .card-art{
    height:200px;
    background:radial-gradient(ellipse at 50% 40%,#16161a 0%,#0c0c0e 100%);
    position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .vinyl{width:110px;height:110px;border-radius:50%;border:1.5px solid rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;position:relative;animation:spin 8s linear infinite;background:radial-gradient(circle at 50% 50%,#1a1a1e 40%,#111114 100%)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .vinyl::after{content:'';width:12px;height:12px;border-radius:50%;background:var(--bg);border:1.5px solid rgba(255,255,255,.06)}
  .vinyl-groove{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.015)}
  .vinyl-groove:nth-child(1){width:60px;height:60px}
  .vinyl-groove:nth-child(2){width:80px;height:80px}
  .vinyl-groove:nth-child(3){width:100px;height:100px}
  .ring-outer{position:absolute;width:150px;height:150px;border-radius:50%;border:1px solid rgba(255,255,255,.02)}
  .track-num{position:absolute;top:12px;right:14px;font-size:9px;color:var(--text3);font-weight:500;letter-spacing:.8px;opacity:.6}

  /* Subtle shimmer on art */
  .card-art::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(255,255,255,.01) 0%,transparent 50%,rgba(255,255,255,.005) 100%);
    pointer-events:none;
  }

  /* Audio controls */
  .audio-controls{padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.15))}

  /* Waveform */
  .waveform-row{display:flex;align-items:center;justify-content:center;gap:1.5px;height:28px;padding:0 2px}
  .wbar{width:2px;border-radius:1px;background:var(--text3);opacity:.5;transition:opacity .15s}
  .playing .wbar{animation:wPulse .5s ease infinite alternate}
  @keyframes wPulse{from{opacity:.25}to{opacity:.9}}

  .progress-wrap{display:flex;align-items:center;gap:8px}
  .progress-time{font-size:9px;color:var(--text3);font-weight:500;font-variant-numeric:tabular-nums;min-width:24px}
  .progress-bar{flex:1;height:2px;background:rgba(255,255,255,.06);border-radius:1px;position:relative;overflow:visible}
  .progress-fill{height:100%;background:var(--text2);border-radius:1px;width:0%;transition:width .3s linear}
  .progress-knob{position:absolute;top:50%;transform:translate(0,-50%);width:8px;height:8px;border-radius:50%;background:var(--text);box-shadow:0 0 6px rgba(255,255,255,.15);opacity:0;transition:opacity .2s;right:-4px}
  .playing .progress-knob{opacity:1}

  .transport{display:flex;align-items:center;justify-content:center;gap:20px}
  .t-btn{width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .t-btn:hover{color:var(--text2)}
  .t-btn:active{transform:scale(.88)}
  .t-btn svg{width:16px;height:16px;fill:currentColor}
  .play-btn{
    width:44px;height:44px;
    background:var(--text);color:var(--bg);
    border-radius:50%;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s;
    box-shadow:0 2px 12px rgba(255,255,255,.08);
  }
  .play-btn:hover{transform:scale(1.06);box-shadow:0 4px 20px rgba(255,255,255,.12)}
  .play-btn:active{transform:scale(.94)}
  .play-btn svg{width:20px;height:20px;fill:currentColor;margin-left:2px}
  .no-audio-msg{font-size:9px;color:var(--text3);text-align:center;padding:4px 0 0;opacity:.5;font-style:italic}

  /* Listen lock */
  .listen-lock{
    position:absolute;bottom:0;left:0;right:0;
    padding:8px 16px;
    background:rgba(7,7,9,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;gap:6px;
    border-top:1px solid var(--border);
    border-radius:0 0 22px 22px;
    transition:all .4s cubic-bezier(.22,1,.36,1);
    z-index:5;
  }
  .listen-lock.unlocked{
    opacity:0;transform:translateY(8px);pointer-events:none;
  }
  .lock-icon{font-size:13px}
  .lock-text{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.3px}
  .listen-lock.shake{animation:lockShake .4s ease}
  @keyframes lockShake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }

  /* Bottom */
  .bottom-bar{padding:0 24px 38px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:0}
  .score-bar{display:flex;gap:5px}
  .score-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.06);transition:all .35s cubic-bezier(.22,1,.36,1)}
  .score-dot.correct{background:var(--real);box-shadow:0 0 6px var(--real-glow)}
  .score-dot.wrong{background:var(--fake);box-shadow:0 0 6px var(--fake-glow)}
  .score-dot.current{background:var(--text2);transform:scale(1.5)}

  /* ====== RESULT OVERLAY ====== */
  .result-overlay{position:absolute;inset:0;background:rgba(6,6,8,.97);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);z-index:100;display:none;flex-direction:column;align-items:center;padding:0 28px;opacity:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .result-overlay.visible{display:flex;animation:rFade .3s ease forwards}
  @keyframes rFade{to{opacity:1}}

  .verdict-strip{width:calc(100% + 56px);margin:0 -28px;padding:56px 28px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
  .verdict-strip.correct-strip{background:linear-gradient(180deg,rgba(60,255,158,.05) 0%,transparent 100%)}
  .verdict-strip.wrong-strip{background:linear-gradient(180deg,rgba(255,68,68,.05) 0%,transparent 100%)}

  .verdict-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 16px;border-radius:16px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;animation:chipPop .4s cubic-bezier(.22,1,.36,1) forwards;opacity:0;transform:scale(.85)}
  @keyframes chipPop{to{opacity:1;transform:scale(1)}}
  .verdict-chip.correct-chip{background:rgba(60,255,158,.08);border:1px solid rgba(60,255,158,.2);color:var(--real)}
  .verdict-chip.wrong-chip{background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.2);color:var(--fake)}
  .chip-dot{width:5px;height:5px;border-radius:50%}
  .correct-chip .chip-dot{background:var(--real)}
  .wrong-chip .chip-dot{background:var(--fake)}

  .verdict-label{font-family:'Instrument Serif',serif;font-size:28px;font-style:italic;animation:vIn .45s ease forwards;animation-delay:.06s;opacity:0;transform:translateY(5px)}
  @keyframes vIn{to{opacity:1;transform:translateY(0)}}
  .verdict-label.correct-label{color:var(--real)}
  .verdict-label.wrong-label{color:var(--fake)}

  .verdict-sub{font-size:13px;color:var(--text2);font-weight:400;animation:sIn .45s ease forwards;animation-delay:.12s;opacity:0}
  @keyframes sIn{to{opacity:1}}

  .reveal-section{width:100%;padding:18px 0 14px;border-bottom:1px solid var(--border);margin-bottom:14px;text-align:center;animation:sIn .5s ease forwards;animation-delay:.18s;opacity:0}
  .reveal-track{font-family:'Instrument Serif',serif;font-size:21px;letter-spacing:-.3px;display:block;margin-bottom:2px}
  .reveal-artist{font-size:11px;color:var(--text3);font-weight:500;display:block;letter-spacing:.3px}

  .blurb-section{width:100%;padding:0;margin-bottom:16px;animation:sIn .5s ease forwards;animation-delay:.24s;opacity:0}
  .blurb{font-size:13px;color:var(--text2);line-height:1.7;font-weight:300;font-style:italic;text-align:center}

  .evidence-section{width:100%;display:flex;flex-direction:column;gap:5px;margin-bottom:20px;animation:sIn .5s ease forwards;animation-delay:.3s;opacity:0}
  .evidence-item{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;background:var(--glass);border:1px solid var(--border);border-radius:10px;text-decoration:none;transition:border-color .2s}
  .evidence-item:hover{border-color:rgba(255,255,255,.1)}
  .ev-dot{width:5px;height:5px;border-radius:50%;margin-top:5px;flex-shrink:0}
  .ev-dot.real-ev{background:var(--real)}
  .ev-dot.fake-ev{background:var(--fake)}
  .ev-text{font-size:11px;color:var(--text2);line-height:1.4;font-weight:400}
  .ev-link{font-size:9px;color:var(--text3);margin-top:1px;display:block;opacity:.5}

  .next-btn{
    padding:13px 48px;border-radius:28px;
    background:var(--text);color:var(--bg);
    font-size:13px;font-weight:700;border:none;cursor:pointer;
    font-family:'Manrope',sans-serif;letter-spacing:.3px;
    transition:all .15s;margin-bottom:36px;
    animation:sIn .5s ease forwards;animation-delay:.36s;opacity:0;flex-shrink:0;
    box-shadow:0 2px 16px rgba(255,255,255,.06);
  }
  .next-btn:hover{transform:scale(1.03)}
  .next-btn:active{transform:scale(.97)}

  .empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;position:absolute;inset:0;padding:40px;z-index:50}
  .empty-state.visible{display:flex}
  .empty-icon{font-size:40px;margin-bottom:14px}
  .empty-title{font-family:'Instrument Serif',serif;font-size:20px;font-style:italic;margin-bottom:4px}
  .empty-sub{font-size:12px;color:var(--text2);text-align:center;font-weight:300}

  @media(max-width:400px){.phone{width:100vw;height:100vh}.music-card{max-width:calc(100vw - 40px)}}
</style>
</head>
<body>
<div class="phone">
  <div class="top-bar">
    <div class="logo">AI or Not</div>
    <div class="streak-badge" id="streakBadge"><span>🔥</span><span id="streakCount">0</span></div>
  </div>
  <div class="genre-bar">
    <div class="genre-pill active" onclick="selectGenre(this)">Rock</div>
    <div class="genre-pill" onclick="selectGenre(this)">Hip Hop</div>
    <div class="genre-pill" onclick="selectGenre(this)">Pop</div>
    <div class="genre-pill" onclick="selectGenre(this)">Jazz</div>
    <div class="genre-pill" onclick="selectGenre(this)">Electronic</div>
  </div>
  <div class="card-area" id="cardArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🎸</div>
      <div class="empty-title">You cleared the deck</div>
      <div class="empty-sub">Come back tomorrow for fresh tracks</div>
      <button class="next-btn" style="margin-top:20px;opacity:1" onclick="replayDeck()">Play Again</button>
    </div>
  </div>
  <div class="bottom-bar">
    <div class="score-bar" id="scoreBar"></div>
  </div>

  <div class="result-overlay" id="resultOverlay">
    <div class="verdict-strip" id="verdictStrip">
      <div class="verdict-chip" id="verdictChip"><div class="chip-dot"></div><span id="chipText"></span></div>
      <div class="verdict-label" id="verdictLabel"></div>
      <div class="verdict-sub" id="verdictSub"></div>
    </div>
    <div class="reveal-section" id="revealSection"></div>
    <div class="blurb-section" id="blurbSection"></div>
    <div class="evidence-section" id="evidenceSection"></div>
    <button class="next-btn" onclick="nextCard()">Next Track</button>
  </div>
</div>

<script>
// ===== CONFIG =====
const API_BASE = ""; // same origin

const tracks=[
  {track:"Back in Black",artist:"AC/DC",duration:"4:15",year:"1980",isAI:false,
    deezerQuery:"AC/DC Back in Black",
    audioUrl:"https://cdns-preview-d.dzcdn.net/stream/c-deda7fa9316d9e9e880d2c6207e92260-5.mp3",
    blurb:"Brian Johnson laid down these vocals at Compass Point Studios in Nassau, Bahamas, spring of 1980 — just months after Bon Scott's death. Mutt Lange produced. Atlantic Records pressed the original.",
    evidence:[{text:"Original Atlantic Records master, produced by Mutt Lange",url:"https://en.wikipedia.org/wiki/Back_in_Black"},{text:"Recorded April–May 1980 at Compass Point Studios",url:"https://www.allmusic.com/album/back-in-black"}]},
  {track:"Enter Sandman",artist:"Metallica",duration:"5:31",year:"2025",isAI:true,
    deezerQuery:"Metallica Enter Sandman",
    audioUrl:"",
    blurb:"This isn't Hetfield. Someone fed Metallica's catalog into Suno v4 and cloned the vocal tone with ElevenLabs. Multiple threads on r/metallica flagged it within hours. No label, no studio, no master tape — just code.",
    evidence:[{text:"Flagged as AI by multiple users on r/metallica",url:"https://reddit.com/r/metallica"},{text:"Vocal signature matches ElevenLabs cloning pattern",url:"https://aivoicedetector.com"}]},
  {track:"Stairway to Heaven",artist:"Led Zeppelin",duration:"8:02",year:"1971",isAI:false,
    deezerQuery:"Led Zeppelin Stairway to Heaven",
    audioUrl:"",
    blurb:"Jimmy Page and Robert Plant recorded this at Headley Grange, a converted poorhouse in Hampshire, with overdubs at Island Studios in London. Late 1971. Andy Johns engineered. Page remastered it himself in 2014.",
    evidence:[{text:"Recorded late 1971, engineered by Andy Johns",url:"https://en.wikipedia.org/wiki/Stairway_to_Heaven"},{text:"Atlantic Records master, remastered by Page in 2014",url:"https://www.allmusic.com/album/led-zeppelin-iv"}]},
  {track:"Bohemian Rhapsody",artist:"Queen",duration:"5:55",year:"2026",isAI:true,
    deezerQuery:"Queen Bohemian Rhapsody",
    audioUrl:"",
    blurb:"Freddie's been dead since 1991, and his estate hasn't authorized a single AI release. This was generated on Udio and posted without credit. The harmonies are close — eerily close — but the vibrato is too clean. Freddie was never that precise.",
    evidence:[{text:"Community reports confirm Udio-generated recreation",url:"https://reddit.com/r/queen"},{text:"Mercury estate has not authorized any AI releases",url:"https://www.queenonline.com"}]},
  {track:"Smells Like Teen Spirit",artist:"Nirvana",duration:"5:01",year:"1991",isAI:false,
    deezerQuery:"Nirvana Smells Like Teen Spirit",
    audioUrl:"",
    blurb:"Kurt Cobain tracked this at Sound City Studios in Van Nuys, California, between May and June of 1991. Butch Vig produced. The vocal take is famously raw — Cobain shredded his throat getting it right.",
    evidence:[{text:"Produced by Butch Vig at Sound City Studios, 1991",url:"https://en.wikipedia.org/wiki/Smells_Like_Teen_Spirit"},{text:"Original DGC/Geffen Records release",url:"https://www.discogs.com/master/Nirvana-Nevermind"}]},
  {track:"Highway to Hell",artist:"AC/DC",duration:"3:28",year:"2025",isAI:true,
    deezerQuery:"AC/DC Highway to Hell",
    audioUrl:"",
    blurb:"Bon Scott died in February 1980. No new recordings exist. This was stitched together using ElevenLabs voice cloning and Suno's instrumental engine. The rasp is close, but it doesn't decay like Bon's did.",
    evidence:[{text:"Flagged by Hive Moderation deepfake detector",url:"https://hivemoderation.com"},{text:"Bon Scott passed in 1980 — no new recordings exist",url:"https://en.wikipedia.org/wiki/Bon_Scott"}]},
  {track:"Nothing Else Matters",artist:"Metallica",duration:"6:28",year:"1991",isAI:false,
    deezerQuery:"Metallica Nothing Else Matters",
    audioUrl:"",
    blurb:"James Hetfield wrote this alone in his bunk on tour, never intending it for the album. Bob Rock convinced him otherwise. They tracked it at One on One Studios in North Hollywood. The acoustic intro is Hetfield at his most vulnerable.",
    evidence:[{text:"Produced by Bob Rock at One on One Studios",url:"https://en.wikipedia.org/wiki/Nothing_Else_Matters"},{text:"Written as personal piece, nearly left off the album",url:"https://www.allmusic.com/song/nothing-else-matters"}]},
  {track:"Thunderstruck",artist:"AC/DC",duration:"4:52",year:"2026",isAI:true,
    deezerQuery:"AC/DC Thunderstruck",
    audioUrl:"",
    blurb:"That intro tapping riff? Too perfect. Angus Young's fingers drift — that's what makes it human. This version was generated on Suno v4.5 with crowd noise layered in for realism. YouTube posts called it out within a day.",
    evidence:[{text:"YouTube community posts confirm AI origin",url:"https://youtube.com/community"},{text:"Intro tapping has zero timing drift — inhuman precision",url:"https://aivoicedetector.com"}]},
  {track:"Black Dog x Whole Lotta Love",artist:"Led Zeppelin",duration:"4:18",year:"2025",isAI:true,type:"remix",
    deezerQuery:"Led Zeppelin Black Dog",
    audioUrl:"",
    blurb:"A fan on YouTube stitched two Zeppelin classics together using Suno and layered Plant's AI-cloned vocals over a remixed riff. It hit 2M views in a week. The transitions are seamless — suspiciously so. No human DJ blends two different keys that cleanly.",
    evidence:[{text:"Uploaded by fan account, not affiliated with Led Zeppelin estate",url:"https://youtube.com"},{text:"Audio analysis shows AI-generated vocal splicing",url:"https://aivoicedetector.com"}]},
  {track:"Master of Puppets (Synthwave Remix)",artist:"Metallica",duration:"5:44",year:"2026",isAI:true,type:"remix",
    deezerQuery:"Metallica Master of Puppets",
    audioUrl:"",
    blurb:"Someone ran the original Master of Puppets through an AI style-transfer tool and dropped Hetfield's vocals onto a full synthwave arrangement. It sounds incredible — and that's the problem. Hetfield's voice has never touched a synth pad like this. The vocal isolation is too clean to be a manual rip.",
    evidence:[{text:"Posted as 'AI Remix' on YouTube, 800K views",url:"https://youtube.com"},{text:"Vocal isolation artifacts consistent with AI separation tools",url:"https://hivemoderation.com"}]},
  {track:"Paranoid (Lo-fi Beats Remix)",artist:"Black Sabbath",duration:"3:12",year:"2025",isAI:true,type:"remix",
    deezerQuery:"Black Sabbath Paranoid",
    audioUrl:"",
    blurb:"Ozzy's vocals pitched down and dropped over lo-fi hip hop beats — a YouTube bedroom producer's AI experiment that went viral. The original vocal stem was never officially released, which means this was AI-separated from the master. Ozzy's team hasn't commented.",
    evidence:[{text:"Fan-made remix using AI vocal extraction, 1.5M views",url:"https://youtube.com"},{text:"No official vocal stem release exists for this track",url:"https://www.discogs.com/master/Black-Sabbath-Paranoid"}]}
];

// Fetch Deezer previews from backend on startup
async function fetchPreviews(){
  const queries = tracks.map(t => t.deezerQuery).join(",");
  try {
    const resp = await fetch(`${API_BASE}/v1/audio/preview/batch?q=${encodeURIComponent(queries)}`);
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    if(data.results){
      data.results.forEach((p, i) => {
        if(p.preview_url && i < tracks.length){
          tracks[i].audioUrl = p.preview_url;
          if(p.duration) tracks[i].duration = fmtTime(p.duration);
        }
      });
    }
    console.log(`Loaded ${data.results.filter(p=>p.preview_url).length} Deezer previews`);
  } catch(e){
    console.warn("Could not fetch Deezer previews from backend:", e.message);
    console.log("Falling back to simulated playback. Make sure your backend is running at", API_BASE);
  }
}

let currentIndex=0,streak=0,results=[],activeCard=null,audioPlayers={},listenWallTimers={};

function createCards(){
  const area=document.getElementById('cardArea');
  area.querySelectorAll('.music-card').forEach(c=>c.remove());
  const count=Math.min(tracks.length-currentIndex,3);
  for(let i=count-1;i>=0;i--){
    const idx=currentIndex+i;
    if(idx>=tracks.length)continue;
    const t=tracks[idx];
    const card=document.createElement('div');
    card.className='music-card';
    let wbars='';
    for(let b=0;b<36;b++){const h=3+Math.random()*22;wbars+=`<div class="wbar" style="height:${h}px;animation-delay:${(Math.random()*.6).toFixed(2)}s;animation-duration:${(.3+Math.random()*.4).toFixed(2)}s"></div>`}

    const hasAudio=!!t.audioUrl;
    const noAudioMsg=hasAudio?'':'<div class="no-audio-msg">Add audioUrl to enable playback</div>';

    card.innerHTML=`
      <div class="card-art">
        <div class="ring-outer"></div>
        <div class="vinyl"><div class="vinyl-groove"></div><div class="vinyl-groove"></div><div class="vinyl-groove"></div></div>
        <div class="track-num">${idx+1} / ${tracks.length}</div>
      </div>
      <div class="audio-controls" id="ac-${idx}">
        <div class="waveform-row" id="wave-${idx}">${wbars}</div>
        <div class="progress-wrap">
          <span class="progress-time" id="elapsed-${idx}">0:00</span>
          <div class="progress-bar" id="pbar-${idx}" onclick="event.stopPropagation();seekTo(${idx},event)">
            <div class="progress-fill" id="fill-${idx}"></div>
            <div class="progress-knob"></div>
          </div>
          <span class="progress-time" id="dur-${idx}">${t.duration}</span>
        </div>
        <div class="transport">
          <button class="t-btn" onclick="event.stopPropagation();seekRel(${idx},-10)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" transform="scale(-1,1) translate(-24,0)"/></svg></button>
          <button class="play-btn" id="pb-${idx}" onclick="event.stopPropagation();togglePlay(${idx})"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="t-btn" onclick="event.stopPropagation();seekRel(${idx},10)"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        </div>
        ${noAudioMsg}
      </div>
      <div class="listen-lock" id="lock-${idx}"><span class="lock-icon">🎧</span><span class="lock-text">Listen for 5s to unlock</span></div>`;
    area.appendChild(card);

    // Create Audio element if URL exists
    if(hasAudio){
      const audio=new Audio(t.audioUrl);
      audio.preload='metadata';
      audio.addEventListener('loadedmetadata',()=>{
        document.getElementById('dur-'+idx).textContent=fmtTime(Math.floor(audio.duration));
      });
      audio.addEventListener('timeupdate',()=>{
        if(!audio.duration)return;
        const pct=(audio.currentTime/audio.duration)*100;
        document.getElementById('fill-'+idx).style.width=pct+'%';
        document.getElementById('elapsed-'+idx).textContent=fmtTime(Math.floor(audio.currentTime));
      });
      audio.addEventListener('ended',()=>{
        document.getElementById('pb-'+idx).innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        document.getElementById('ac-'+idx).classList.remove('playing');
      });
      audioPlayers[idx]=audio;
    }
  }
  const top=area.querySelector('.music-card:last-child');
  if(top){activeCard=top;setupDrag(top)}
  updateScoreBar();
}

function togglePlay(idx){
  const audio=audioPlayers[idx];
  const btn=document.getElementById('pb-'+idx);
  const ac=document.getElementById('ac-'+idx);

  if(!audio){
    // Fallback: simulated playback if no audio URL
    simToggle(idx);return;
  }

  if(audio.paused){
    // Pause all others first
    Object.entries(audioPlayers).forEach(([k,a])=>{
      if(k!=idx&&!a.paused){a.pause();document.getElementById('pb-'+k).innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';document.getElementById('ac-'+k).classList.remove('playing')}
    });
    audio.play().catch(()=>{});
    btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
    ac.classList.add('playing');
    // Wall-clock listen timer — counts regardless of whether audio actually plays
    if(!listenWallTimers[idx]){
      listenWallTimers[idx]=setInterval(()=>{
        listenTime[idx]=(listenTime[idx]||0)+0.2;
        updateListenLock(idx);
        if(listenTime[idx]>=5){clearInterval(listenWallTimers[idx]);delete listenWallTimers[idx];}
      },200);
    }
  } else {
    audio.pause();
    btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    ac.classList.remove('playing');
    clearInterval(listenWallTimers[idx]);delete listenWallTimers[idx];
  }
}

function seekTo(idx,e){
  const audio=audioPlayers[idx];
  if(!audio||!audio.duration)return;
  const bar=document.getElementById('pbar-'+idx);
  const rect=bar.getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  audio.currentTime=pct*audio.duration;
}

function seekRel(idx,sec){
  const audio=audioPlayers[idx];
  if(!audio||!audio.duration){
    // Fallback simulated
    simSeek(idx,sec>0?10:-10);return;
  }
  audio.currentTime=Math.max(0,Math.min(audio.duration,audio.currentTime+sec));
}

// Simulated playback fallback (when no audioUrl)
let simState={},simTimers={};
function simToggle(idx){
  const btn=document.getElementById('pb-'+idx),fill=document.getElementById('fill-'+idx),el=document.getElementById('elapsed-'+idx),ac=document.getElementById('ac-'+idx);
  if(!simState[idx]){
    simState[idx]={progress:parseFloat(fill.style.width)||0};
    btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
    ac.classList.add('playing');
    simTimers[idx]=setInterval(()=>{
      simState[idx].progress+=.4;
      if(!listenTime[idx])listenTime[idx]=0;
      listenTime[idx]+=0.2;
      updateListenLock(idx);
      if(simState[idx].progress>=100){simState[idx].progress=100;clearInterval(simTimers[idx]);simState[idx]=null;btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';ac.classList.remove('playing')}
      fill.style.width=(simState[idx]?.progress||0)+'%';
      const tot=parseDur(tracks[idx].duration);el.textContent=fmtTime(Math.floor(tot*(simState[idx]?.progress||0)/100));
    },200);
  } else {
    clearInterval(simTimers[idx]);simState[idx]=null;
    btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    ac.classList.remove('playing');
  }
}
function simSeek(idx,delta){
  const f=document.getElementById('fill-'+idx),e=document.getElementById('elapsed-'+idx);
  if(!simState[idx])simState[idx]={progress:parseFloat(f.style.width)||0};
  simState[idx].progress=Math.max(0,Math.min(100,simState[idx].progress+(delta>0?10:-10)));
  f.style.width=simState[idx].progress+'%';
  e.textContent=fmtTime(Math.floor(parseDur(tracks[idx].duration)*simState[idx].progress/100));
}

function parseDur(d){const p=d.split(':');return+p[0]*60+ +p[1]}
function fmtTime(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

// Listen time tracking — must listen 5s before swiping
let listenTime={};
function getListenTime(idx){return listenTime[idx]||0}
function canSwipe(idx){return getListenTime(idx)>=5}
function updateListenLock(idx){
  const lock=document.getElementById('lock-'+idx);
  if(!lock)return;
  if(canSwipe(idx)){
    lock.classList.add('unlocked');
  } else {
    const remaining=Math.ceil(5-getListenTime(idx));
    lock.querySelector('.lock-text').textContent=`Listen for ${remaining}s to unlock`;
  }
}

function stopAll(){
  Object.values(audioPlayers).forEach(a=>{try{a.pause();a.currentTime=0}catch(e){}});
  audioPlayers={};
  Object.keys(simTimers).forEach(k=>clearInterval(simTimers[k]));simState={};simTimers={};
  Object.keys(listenWallTimers).forEach(k=>clearInterval(listenWallTimers[k]));listenWallTimers={};
  listenTime={};
}

function setupDrag(card){
  const idx=parseInt(card.querySelector('.track-num')?.textContent)||currentIndex;
  let sx=0,cx=0,drag=false;
  function down(x){
    if(!canSwipe(currentIndex)){
      // Shake the lock indicator
      const lock=document.getElementById('lock-'+currentIndex);
      if(lock&&!lock.classList.contains('unlocked')){lock.classList.add('shake');setTimeout(()=>lock.classList.remove('shake'),400)}
      return;
    }
    drag=true;cx=0;sx=x;card.style.transition='none';
  }
  function move(x){
    if(!drag)return;cx=x-sx;
    card.style.transform=`translateX(${cx}px) rotate(${cx*.05}deg)`;
    const op=Math.min(Math.abs(cx)/100,1);
    if(cx<-20)card.style.boxShadow=`-4px 0 ${op*40}px var(--fake-glow),0 8px 40px rgba(0,0,0,.4)`;
    else if(cx>20)card.style.boxShadow=`4px 0 ${op*40}px var(--real-glow),0 8px 40px rgba(0,0,0,.4)`;
    else card.style.boxShadow='0 8px 40px rgba(0,0,0,.4)';
  }
  function up(){
    if(!drag)return;drag=false;
    card.style.transition='transform .4s cubic-bezier(.22,1,.36,1),opacity .4s,box-shadow .3s';
    if(cx>80){card.style.transform=`translateX(${innerWidth}px) rotate(18deg)`;card.style.opacity='0';card.classList.add('gone');cleanup();stopAll();setTimeout(()=>handleSwipe('real'),280)}
    else if(cx<-80){card.style.transform=`translateX(-${innerWidth}px) rotate(-18deg)`;card.style.opacity='0';card.classList.add('gone');cleanup();stopAll();setTimeout(()=>handleSwipe('fake'),280)}
    else{card.style.transform='';card.style.boxShadow='0 8px 40px rgba(0,0,0,.4)'}
  }
  function onMD(e){e.preventDefault();down(e.clientX);document.addEventListener('mousemove',onMM);document.addEventListener('mouseup',onMU)}
  function onMM(e){move(e.clientX)}
  function onMU(){up();document.removeEventListener('mousemove',onMM);document.removeEventListener('mouseup',onMU)}
  function onTS(e){down(e.touches[0].clientX);document.addEventListener('touchmove',onTM,{passive:false});document.addEventListener('touchend',onTE)}
  function onTM(e){e.preventDefault();move(e.touches[0].clientX)}
  function onTE(){up();document.removeEventListener('touchmove',onTM);document.removeEventListener('touchend',onTE)}
  function cleanup(){card.removeEventListener('mousedown',onMD);card.removeEventListener('touchstart',onTS)}
  card.addEventListener('mousedown',onMD);card.addEventListener('touchstart',onTS,{passive:true});
}

function handleSwipe(g){
  const t=tracks[currentIndex];
  const ok=(g==='fake'&&t.isAI)||(g==='real'&&!t.isAI);
  results.push({correct:ok});
  if(ok)streak++;else streak=0;
  showResult(t,ok);
}

function showResult(t,ok){
  const o=document.getElementById('resultOverlay'),strip=document.getElementById('verdictStrip'),chip=document.getElementById('verdictChip'),ct=document.getElementById('chipText'),lbl=document.getElementById('verdictLabel'),sub=document.getElementById('verdictSub'),rev=document.getElementById('revealSection'),bl=document.getElementById('blurbSection'),ev=document.getElementById('evidenceSection'),sb=document.getElementById('streakBadge'),sc=document.getElementById('streakCount');
  if(ok){strip.className='verdict-strip correct-strip';chip.className='verdict-chip correct-chip';ct.textContent='CORRECT';lbl.className='verdict-label correct-label';lbl.textContent='You nailed it';sub.textContent=t.isAI?'This was AI-generated':'This is the real deal'}
  else{strip.className='verdict-strip wrong-strip';chip.className='verdict-chip wrong-chip';ct.textContent='WRONG';lbl.className='verdict-label wrong-label';lbl.textContent='Not quite';sub.textContent=t.isAI?'That was actually AI':'That was actually real'}
  rev.innerHTML=t.isAI
    ?(t.type==='remix'
      ?`<span class="reveal-track">Fan-made AI remix</span><span class="reveal-artist">${t.artist} · "${t.track}" · YouTube</span>`
      :`<span class="reveal-track">AI-generated clone</span><span class="reveal-artist">Mimicking ${t.artist} · "${t.track}"</span>`)
    :`<span class="reveal-track">${t.track}</span><span class="reveal-artist">${t.artist} · ${t.year}</span>`;
  bl.innerHTML=`<div class="blurb">${t.blurb}</div>`;
  const dc=t.isAI?'fake-ev':'real-ev';
  ev.innerHTML=t.evidence.map(e=>`<a class="evidence-item" href="${e.url}" target="_blank" rel="noopener"><div class="ev-dot ${dc}"></div><div><div class="ev-text">${e.text}</div><span class="ev-link">${e.url.replace('https://','').split('/')[0]}</span></div></a>`).join('');
  if(streak>1){sb.classList.add('visible');sc.textContent=streak}else sb.classList.remove('visible');
  o.classList.add('visible');updateScoreBar();
}

function nextCard(){document.getElementById('resultOverlay').classList.remove('visible');document.getElementById('resultOverlay').style.opacity='0';currentIndex++;if(currentIndex>=tracks.length){document.getElementById('emptyState').classList.add('visible');return}createCards()}
function updateScoreBar(){const b=document.getElementById('scoreBar');let h='';for(let i=0;i<tracks.length;i++){if(i<results.length)h+=`<div class="score-dot ${results[i].correct?'correct':'wrong'}"></div>`;else if(i===currentIndex)h+=`<div class="score-dot current"></div>`;else h+=`<div class="score-dot"></div>`}b.innerHTML=h}
function selectGenre(el){document.querySelectorAll('.genre-pill').forEach(p=>p.classList.remove('active'));el.classList.add('active')}
function replayDeck(){currentIndex=0;streak=0;results=[];stopAll();document.getElementById('emptyState').classList.remove('visible');document.getElementById('streakBadge').classList.remove('visible');for(let i=tracks.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tracks[i],tracks[j]]=[tracks[j],tracks[i]]}createCards()}

// Init — fetch Deezer previews then build UI
(async function init(){
  await fetchPreviews();
  createCards();
})();
</script>
</body>
</html>
