<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fake or Real? — AIBlock Audio Game</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.02em; }
    h1 span { color: #818cf8; }

    #subtitle { color: #94a3b8; font-size: 1rem; }

    #game-area {
      background: #1e1e2e;
      border: 1px solid #2d2d44;
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    #track-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    #cover {
      width: 72px;
      height: 72px;
      border-radius: 0.5rem;
      object-fit: cover;
      background: #2d2d44;
      flex-shrink: 0;
    }

    #track-meta h2 { font-size: 1.1rem; font-weight: 700; }
    #track-meta p  { font-size: 0.875rem; color: #94a3b8; margin-top: 0.25rem; }

    audio {
      width: 100%;
      border-radius: 0.5rem;
      accent-color: #818cf8;
    }

    #choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    button {
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      border: 2px solid transparent;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.15s;
    }

    #btn-real {
      background: #16a34a20;
      border-color: #16a34a;
      color: #4ade80;
    }
    #btn-real:hover { background: #16a34a40; }

    #btn-fake {
      background: #dc262620;
      border-color: #dc2626;
      color: #f87171;
    }
    #btn-fake:hover { background: #dc262640; }

    #btn-next {
      grid-column: span 2;
      background: #4f46e5;
      color: #fff;
      border-color: #4f46e5;
    }
    #btn-next:hover { background: #4338ca; border-color: #4338ca; }
    #btn-next:disabled { opacity: 0.4; cursor: not-allowed; }

    #feedback {
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      min-height: 1.5rem;
    }
    .correct { color: #4ade80; }
    .incorrect { color: #f87171; }

    #score-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      color: #94a3b8;
    }

    #loading {
      text-align: center;
      color: #94a3b8;
      font-size: 1rem;
    }

    #error-msg {
      text-align: center;
      color: #f87171;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>

<h1>Fake or <span>Real?</span></h1>
<p id="subtitle">Listen to the preview, then decide: AI-generated or genuine artist?</p>

<div id="game-area">
  <div id="loading">Loading tracks…</div>
  <div id="error-msg"></div>

  <div id="track-info" style="display:none">
    <img id="cover" src="" alt="Album cover" />
    <div id="track-meta">
      <h2 id="track-title">—</h2>
      <p id="track-artist">—</p>
    </div>
  </div>

  <audio id="player" controls style="display:none"></audio>

  <div id="choices" style="display:none">
    <button id="btn-real" onclick="guess('real')">Real Artist</button>
    <button id="btn-fake" onclick="guess('fake')">AI Fake</button>
    <button id="btn-next" onclick="nextTrack()" disabled>Next Track →</button>
  </div>

  <div id="feedback"></div>

  <div id="score-bar" style="display:none">
    <span>Score: <strong id="score">0</strong></span>
    <span>Track <strong id="track-num">1</strong> / <strong id="track-total">?</strong></span>
  </div>
</div>

<script>
  // Queries sent to the batch endpoint on startup.
  // Half are real tracks, half are "AI" placeholder queries.
  const REAL_QUERIES = [
    "AC/DC Back in Black",
    "Billie Eilish Bad Guy",
    "The Beatles Hey Jude",
    "Daft Punk Get Lucky",
    "Kendrick Lamar HUMBLE",
  ];
  const FAKE_QUERIES = [
    "AI generated pop beat 2024",
    "synthwave instrumental lo-fi AI",
    "generative music neural net chill",
    "AI singer deep fake ballad",
    "machine learning EDM drop",
  ];

  let tracks = [];   // { preview_url, title, artist, cover_url, isReal }
  let index = 0;
  let score = 0;
  let answered = false;

  const API_BASE = '';

  async function loadTracks() {
    const allQueries = [...REAL_QUERIES, ...FAKE_QUERIES].join(",");
    const url = `${API_BASE}/v1/audio/preview/batch?q=${encodeURIComponent(allQueries)}`;

    try {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();

      const results = data.results || [];
      tracks = results
        .filter(r => r.found && r.preview_url)
        .map(r => ({
          ...r,
          isReal: REAL_QUERIES.some(q =>
            r.query.toLowerCase().includes(q.split(" ")[0].toLowerCase())
          ),
        }));

      // Shuffle
      tracks.sort(() => Math.random() - 0.5);

      if (tracks.length === 0) {
        showError("No preview tracks could be loaded. Check the API.");
        return;
      }

      document.getElementById("loading").style.display = "none";
      document.getElementById("track-total").textContent = tracks.length;
      document.getElementById("score-bar").style.display = "flex";
      renderTrack();
    } catch (err) {
      showError(`Failed to load tracks: ${err.message}`);
    }
  }

  function renderTrack() {
    if (index >= tracks.length) {
      endGame();
      return;
    }

    answered = false;
    const t = tracks[index];

    document.getElementById("track-title").textContent  = t.title  || "Unknown Title";
    document.getElementById("track-artist").textContent = t.artist || "Unknown Artist";
    document.getElementById("cover").src = t.cover_url || "";
    document.getElementById("player").src = t.preview_url;
    document.getElementById("player").load();

    document.getElementById("track-info").style.display = "flex";
    document.getElementById("player").style.display     = "block";
    document.getElementById("choices").style.display    = "grid";
    document.getElementById("feedback").textContent     = "";
    document.getElementById("track-num").textContent    = index + 1;
    document.getElementById("btn-next").disabled        = true;

    document.getElementById("btn-real").disabled = false;
    document.getElementById("btn-fake").disabled = false;
  }

  function guess(choice) {
    if (answered) return;
    answered = true;

    const t = tracks[index];
    const correct = (choice === "real" && t.isReal) || (choice === "fake" && !t.isReal);

    const fb = document.getElementById("feedback");
    if (correct) {
      score++;
      fb.textContent = "Correct! 🎯";
      fb.className = "correct";
    } else {
      fb.textContent = `Wrong — this was ${t.isReal ? "a real artist" : "AI-generated"}.`;
      fb.className = "incorrect";
    }

    document.getElementById("score").textContent = score;
    document.getElementById("btn-real").disabled = true;
    document.getElementById("btn-fake").disabled = true;
    document.getElementById("btn-next").disabled = false;
  }

  function nextTrack() {
    index++;
    renderTrack();
  }

  function endGame() {
    document.getElementById("track-info").style.display = "none";
    document.getElementById("player").style.display     = "none";
    document.getElementById("choices").style.display    = "none";
    document.getElementById("feedback").textContent =
      `Game over! Final score: ${score} / ${tracks.length}`;
    document.getElementById("feedback").className = score >= tracks.length / 2 ? "correct" : "incorrect";
  }

  function showError(msg) {
    document.getElementById("loading").style.display  = "none";
    const el = document.getElementById("error-msg");
    el.textContent = msg;
    el.style.display = "block";
  }

  loadTracks();
</script>
</body>
</html>
